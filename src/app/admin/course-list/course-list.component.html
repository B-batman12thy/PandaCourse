<!-- src/app/admin/course-list/course-list.component.html -->
<div class="px-4 sm:px-6 lg:px-8">
  <div class="sm:flex sm:items-center">
    <div class="sm:flex-auto">
      <h1 class="text-base font-semibold text-gray-900">Liste des cours</h1>
      <p class="mt-2 text-sm text-gray-700">
        Gestion de tous les cours disponibles : titre, durée et actions.
      </p>
    </div>
    <div class="mt-4 sm:ml-16 sm:mt-0 sm:flex-none">
      <button
        (click)="newCourse()"
        class="block rounded-md bg-indigo-600 px-3 py-2 text-center text-sm font-semibold text-white shadow-sm
               hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
      >
        + Nouveau cours
      </button>
    </div>
  </div>

  <div class="mt-8 flow-root">
    <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
      <div class="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
        <table class="min-w-full divide-y divide-gray-300">
          <thead>
            <tr>
              <th
                scope="col"
                class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-0"
              >
                Titre
              </th>
              <th
                scope="col"
                class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900"
              >
                Durée (min)
              </th>
              <th
                scope="col"
                class="relative py-3.5 pl-3 pr-4 text-right text-sm font-semibold text-gray-900 sm:pr-0"
              >
                Actions
              </th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <tr *ngFor="let c of pagedCourses">
              <td
                class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-0"
              >
                {{ c.title }}
              </td>
              <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                {{ c.duration }}
              </td>
              <td
                class="relative whitespace-nowrap py-4 pl-3 pr-4 text-right text-sm font-medium sm:pr-0 space-x-2"
              >
                <button
                  (click)="edit(c.id)"
                  class="text-indigo-600 hover:text-indigo-900"
                >
                  Edit
                  <span class="sr-only">, {{ c.title }}</span>
                </button>
                <button
                  (click)="remove(c.id)"
                  class="text-red-600 hover:text-red-900"
                >
                  Delete
                  <span class="sr-only">, {{ c.title }}</span>
                </button>
              </td>
            </tr>

            <tr *ngIf="courses.length === 0">
              <td colspan="3" class="whitespace-nowrap py-4 text-center text-sm text-gray-500">
                Aucun cours trouvé.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="mt-4 flex justify-between items-center">
    <button
      (click)="prev()"
      [disabled]="currentPage === 1"
      class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 disabled:opacity-50"
    >
      Previous
    </button>

    <div class="space-x-1">
      <button
        *ngFor="let p of pages"
        (click)="goToPage(p)"
        [class.font-bold]="currentPage === p"
        class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300"
      >
        {{ p }}
      </button>
    </div>

    <button
      (click)="next()"
      [disabled]="currentPage === totalPages"
      class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 disabled:opacity-50"
    >
      Next
    </button>
  </div>
</div>
