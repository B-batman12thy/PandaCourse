<!-- src/app/auth/login/login.component.html -->
<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-lg">
    <!-- Titre -->
    <h1 class="text-2xl font-bold text-center mb-6">
      Bienvenue sur PandaCourse
    </h1>

    <!-- Formulaire -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700">
          Username
        </label>
        <div class="mt-1">
          <input
            id="username"
            formControlName="username"
            type="text"
            class="block w-full rounded-md border-gray-400 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
            placeholder="Votre nom d’utilisateur"
          />
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">
          Password
        </label>
        <div class="mt-1">
          <input
            id="password"
            formControlName="password"
            type="password"
            class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
            
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full py-2 px-4 bg-indigo-600 text-white font-semibold rounded-md shadow hover:bg-indigo-700 disabled:opacity-50"
      >
        Login
      </button>
    </form>
  </div>
</div>
