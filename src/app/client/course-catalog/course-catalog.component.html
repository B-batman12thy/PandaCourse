<!-- src/app/client/course-catalog/course-catalog.component.html -->
<div class="p-6">
  <h2 class="text-3xl font-bold mb-6">Catalogue des cours</h2>
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    <a
      *ngFor="let c of courses"
      [routerLink]="[c.id]"
      class="block bg-white rounded-lg shadow hover:shadow-lg transition p-4 flex flex-col no-underline"
    >
      <h3 class="text-xl font-semibold mb-2 text-gray-900">{{ c.title }}</h3>
      <p class="text-gray-600 flex-1">{{ c.description | slice:0:100 }}…</p>
      <div class="mt-4 flex justify-between items-center">
        <span class="text-sm text-gray-500">{{ c.duration }} min</span>
        <span class="text-sm font-medium text-indigo-600 hover:underline">
          Détails →
        </span>
      </div>
    </a>
  </div>
</div>
