<!-- src/app/client/course-player/course-player.component.html -->
<section class="p-6 max-w-4xl mx-auto">
  <button
    [routerLink]="['/courses', course?.id]"
    class="mb-6 inline-flex items-center text-gray-600 hover:text-gray-800"
  >
    ← Retour au détail
  </button>

  <ng-container *ngIf="course && videoUrl; else loading">
    <h1 class="text-2xl font-bold mb-4">{{ course.title }}</h1>
    <div class="aspect-video mb-6">
      <iframe
        [src]="videoUrl"
        width="100%"
        height="100%"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        class="rounded-lg shadow"
      ></iframe>
    </div>
    <p class="text-gray-700">{{ course.description }}</p>
  </ng-container>

  <ng-template #loading>
    <p class="text-center text-gray-500">Chargement…</p>
  </ng-template>
</section>
